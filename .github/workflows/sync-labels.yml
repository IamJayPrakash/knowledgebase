name: Sync GitHub Repository Labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Labels with GitHub Repository
        uses: EndBug/label-sync@v2
        with:
          config-file: '.github/labels.yml'
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-other-labels: false
